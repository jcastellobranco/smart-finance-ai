name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      POSTGRES_DB: smart_finance
      POSTGRES_USER: postgres
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate ephemeral CI secrets and start PostgreSQL
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          DB_PASSWORD="$(openssl rand -hex 32)"
          DJANGO_SECRET="$(openssl rand -hex 48)"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DJANGO_SECRET"
          echo "POSTGRES_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "SECRET_KEY=$DJANGO_SECRET" >> "$GITHUB_ENV"
          docker run -d --name ci-postgres \
            -e POSTGRES_DB=smart_finance \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            -p 127.0.0.1:5432:5432 postgres:16
          for attempt in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U postgres -d smart_finance >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs ci-postgres
          exit 1
      - run: pip install -r requirements-dev.txt
      - run: ruff check apps config
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: python manage.py test apps.expenses apps.receipts
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
